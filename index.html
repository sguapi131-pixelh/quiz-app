<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>我的刷题本</title>
  <link rel="manifest" href="manifest.json?v=7" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div><div class="eyebrow">申请律师执业实习人员 · 内置题库</div><h1>我的刷题本</h1></div></header>
    <section id="homeView" class="view active">
      <div class="stats-grid">
        <div class="stat-card"><span>题库</span><strong id="statTotal">0</strong></div>
        <div class="stat-card"><span>错题</span><strong id="statWrong">0</strong></div>
        <div class="stat-card"><span>已掌握</span><strong id="statMastered">0</strong></div>
      </div>
      <div class="panel"><h2>开始刷题</h2><p class="muted">750 题已内置：354 道单选 + 396 道多选。</p><div class="actions"><button id="startRandom" class="primary">随机刷题</button><button id="startWrong" class="secondary">只刷错题</button></div></div>
      <div class="panel compact"><div class="row between"><div><h3>答题记录</h3><p class="muted">错题记录只保存在当前设备。</p></div><button id="resetProgress" class="danger-link">清空记录</button></div></div>
    </section>
    <section id="quizView" class="view"><div class="row between quiz-head"><button id="backHome" class="ghost small">返回</button><div id="modeLabel" class="pill"></div><div id="progressLabel" class="muted"></div></div><article class="question-card"><div class="row between"><span id="questionType" class="type-badge"></span><span id="wrongCount" class="wrong-count"></span></div><h2 id="questionText"></h2><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><div class="question-actions"><button id="submitAnswer" class="primary">提交答案</button><button id="nextQuestion" class="secondary hidden">下一题</button></div></article></section>
  </main>
  <script src="questions-1a.js?v=7"></script>
  <script src="questions-1b.js?v=7"></script>
  <script src="questions-2.js?v=7"></script>
  <script src="questions-3a.js?v=7"></script>
  <script src="questions-3b.js?v=7"></script>
  <script src="questions-4a.js?v=7"></script>
  <script src="questions-4b.js?v=7"></script>
  <script src="questions-5a.js?v=7"></script>
  <script src="questions-5b.js?v=7"></script>
  <script src="questions-6a.js?v=7"></script>
  <script src="questions-6b.js?v=7"></script>
  <script src="app-v2.js?v=7"></script>
</body>
</html>
